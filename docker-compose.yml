name: tax calculator app

services:
  service-a:
    image: krishkumar4400/service-a:latest
    container_name: service-a

    ports:
      - "3000:3000"

    depends_on:
      - service-b

    env_file:
      - ./services/service-a/.env

    networks:
      - tax-container

  service-b:
    image: krishkumar4400/service-b:latest
    container_name: service-b

    ports:
      - "4000:4000"
    networks:
      - tax-container


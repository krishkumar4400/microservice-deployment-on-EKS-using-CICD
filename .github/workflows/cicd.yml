name: Tax Calculator Spring CI/CD to AWS EKS

on:
  workflow_dispatch:
  push:
    branches:
      - main

# jobs:
# building and testing
# docker build push
# deploy to EKS

# Matrix: Matrix strategy is a concept in github actions. it allows you to run same number of jobs multiple number of times with different configurations in parallely and it is perfect for avoid duplication

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build and Test
        working-directory: ./service/${{matrix.service}}
        run: mvn -B clean verify

      - name: Upload Test Reports 
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{matrix.service}}
          path: ./service/${{matrix.service}}/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service:
          - {
              name: "service-a",
              docker_name: "service-a",
              path: "./services/service-a",
            }
          - {
              name: "service-b",
              docker_name: "service-b",
              path: "./services/service-b",
            }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Create JAR File for Docker
        working-directory: ${{matrix.service.path}}
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}

      - name: Build and Push Image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ${{matrix.service.path}}
          push: true
          tags: |
            ${{secrets.DOCKER_USERNAME}}/${{matrix.service.docker_name}}:latest

  deploy-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-south-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws els update-kubeconfig --name hello-cluster --region ap-south-1

      - name: Verify Connection
        run: kubectl get nodes

      - name: Deploy to AWS EKS
        run: |
          kubectl apply -f ./k8s

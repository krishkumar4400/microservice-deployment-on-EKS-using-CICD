name: Tax Calculator Spring CI/CD to AWS EKS with Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        working-directory: ./services/service-c
        run: echo "VITE_API_URI=/API" > .env

      - name: Setup NodeJs
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./services/service-c
        run: npm ci # clean install

      - name: Run Tests
        working-directory: ./services/service-c
        run: npm test --if-present

      - name: Build Frontend
        working-directory: ./services/service-c
        run: npm run build

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        working-directory: ./services/service-c
        run: echo "VITE_API_URI=/API" > .env

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}

      - name: Build and Push Image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./services/service-c
          push: true
          tags: |
            ${{secrets.DOCKER_USERNAME}}/service-c:latest

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-south-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws els update-kubeconfig --name hello-cluster --region ap-south-1

      - name: Verify Connection
        run: kubectl get nodes

      - name: Deploy to AWS EKS
        run: |
          kubectl apply -f ./k8s
